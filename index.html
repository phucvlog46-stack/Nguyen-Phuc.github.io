<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Bài Nộp Thiết Kế Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .portal-card {
            background: #ffffff;
            max-width: 700px;
            width: 100%;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #1e3a8a;
            font-size: 28px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .student-info {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }
        .grid-links {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .nav-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 20px 25px;
            border-radius: 12px;
            transition: all 0.25s ease;
            text-align: left;
        }
        .nav-card:hover {
            border-color: #2563eb;
            background: #eff6ff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.15);
        }
        .nav-title {
            font-size: 19px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .nav-desc {
            font-size: 14px;
            color: #475569;
        }
        .arrow {
            font-size: 24px;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="portal-card">
    <h1>BÀI NỘP THỰC HÀNH THIẾT KẾ WEB</h1>
    <div class="student-info">
        Họ và tên: <strong>Châu Nguyên Phúc</strong> &nbsp;|&nbsp; MSSV: <strong>52.01.104.081</strong>
    </div>

   <div class="grid-links">
        <a href="hoca.html" class="nav-card">
            <div>
                <div class="nav-title">1. Bài Hồ Cá </div>
            </div>
            <span class="arrow">→</span>
        </a>

        <a href="cv cá nhân.html" class="nav-card">
            <div>
                <div class="nav-title">2. CV Cá Nhân</div>
            </div>
            <span class="arrow">→</span>
        </a>

        <a href="hanghoa.html" class="nav-card">
            <div>
                <div class="nav-title">3. Danh Sách Hàng Hóa (Bài mở rộng)</div>
            </div>
            <span class="arrow">→</span>
        </a>
    </div>
</div>

</body>
</html>
